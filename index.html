<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CardCapture</title>
<meta name="description" content="CardCapture — a trading card scanner for iPhone and iPad." />
<meta name="theme-color" content="#0b0d10" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230b0d10'/><circle cx='14' cy='14' r='7' fill='none' stroke='%232ebfb3' stroke-width='2'/><path d='M19 19 L26 26' stroke='%232ebfb3' stroke-width='2.5' stroke-linecap='round'/></svg>" />
<style>
  :root{--bg:#0b0d10;--text:#f2f5f8;--text-sec:#a8b3be;--accent:#2ebfb3;--hairline:#232a32}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text-sec);
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .card{max-width:520px;padding:40px 24px;text-align:center}
  h1{color:var(--text);font-size:clamp(30px,6vw,42px);letter-spacing:-.03em;margin:20px 0 10px}
  p{margin:0 auto 26px;max-width:42ch}
  a{color:var(--accent);text-underline-offset:3px}
  .links{display:flex;gap:22px;justify-content:center;flex-wrap:wrap;
    border-top:1px solid var(--hairline);padding-top:20px;font-size:14px}
  @media (prefers-color-scheme: light){
    :root{--bg:#fbfbfc;--text:#12161a;--text-sec:#4a545e;--accent:#12857c;--hairline:#e4e7eb}
  }
</style>
</head>
<body>
  <div class="card">
    <svg width="58" height="58" viewBox="0 0 32 32" aria-label="CardCapture">
      <rect width="32" height="32" rx="8" fill="#14181d"/>
      <circle cx="14" cy="14" r="7" fill="none" stroke="#2ebfb3" stroke-width="2"/>
      <path d="M19 19 L26 26" stroke="#2ebfb3" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
    <h1>CardCapture</h1>
    <p>A trading card scanner for iPhone and iPad. It identifies a card, prices it against
    several markets, checks how the print behaves, and measures its condition — and tells you
    when it cannot be sure.</p>
    <div class="links">
      <a href="./privacy/">Privacy Policy</a>
      <a href="https://www.apple.com/legal/internet-services/itunes/dev/stdeula/">Terms of Use</a>
    </div>
  </div>
</body>
</html>
